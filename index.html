<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>とびだせ どうぶつの森 魚図鑑チェックリスト</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f0f8ff; }
        h1 { color: #2e8b57; text-align: center; }
        table { width: 100%; max-width: 600px; margin: 0 auto; border-collapse: collapse; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        th, td { padding: 8px 10px; border-bottom: 1px solid #ddd; text-align: left; font-size: 14px; }
        th { background-color: #2e8b57; color: white; position: sticky; top: 0; }
        tr:hover { background-color: #f5f5f5; }
        .check-col { text-align: center; width: 40px; }
    </style>
</head>
<body>

    <h1>とびだせ どうぶつの森<br>魚図鑑 全72種</h1>

    <table>
        <thead>
            <tr>
                <th class="check-col">Get</th>
                <th>魚の名前</th>
                <th>主な生息地</th>
            </tr>
        </thead>
        <tbody id="fish-list">
            <!-- ここにJavaScriptで魚のデータが挿入されます -->
        </tbody>
    </table>

    <script>
        // 魚のデータ（全72種）
        const fishData = [
            { id: 1, name: "タナゴ", habitat: "川" },
            { id: 2, name: "オイカワ", habitat: "川" },
            { id: 3, name: "フナ", habitat: "川" },
            { id: 4, name: "ウグイ", habitat: "川" },
            { id: 5, name: "コイ", habitat: "川" },
            { id: 6, name: "ニシキゴイ", habitat: "川" },
            { id: 7, name: "キンギョ", habitat: "川" },
            { id: 8, name: "デメキン", habitat: "川" },
            { id: 9, name: "ランチュウ", habitat: "川" },
            { id: 10, name: "メダカ", habitat: "池" },
            { id: 11, name: "ザリガニ", habitat: "池" },
            { id: 12, name: "スッポン", habitat: "川" },
            { id: 13, name: "オタマジャクシ", habitat: "池" },
            { id: 14, name: "カエル", habitat: "池" },
            { id: 15, name: "ドンコ", habitat: "川" },
            { id: 16, name: "ドジョウ", habitat: "川" },
            { id: 17, name: "ナマズ", habitat: "池" },
            { id: 18, name: "ウナギ", habitat: "川" },
            { id: 19, name: "ハナヒゲウツボ", habitat: "海" },
            { id: 20, name: "アユ", habitat: "川" },
            { id: 21, name: "ヤマメ", habitat: "川" },
            { id: 22, name: "オオイワナ", habitat: "滝" },
            { id: 23, name: "ニジマス", habitat: "川" },
            { id: 24, name: "イトウ", habitat: "川" },
            { id: 25, name: "サケ", habitat: "河口" },
            { id: 26, name: "キングサーモン", habitat: "河口" },
            { id: 27, name: "グッピー", habitat: "川" },
            { id: 28, name: "ドクターフィッシュ", habitat: "川" },
            { id: 29, name: "エンゼルフィッシュ", habitat: "川" },
            { id: 30, name: "ネオンテトラ", habitat: "川" },
            { id: 31, name: "ピラニア", habitat: "川" },
            { id: 32, name: "アロワナ", habitat: "川" },
            { id: 33, name: "ドラド", habitat: "川" },
            { id: 34, name: "ガー", habitat: "池" },
            { id: 35, name: "ピラルク", habitat: "川" },
            { id: 36, name: "エンドリケリー", habitat: "川" },
            { id: 37, name: "クリオネ", habitat: "海" },
            { id: 38, name: "タツノオトシゴ", habitat: "海" },
            { id: 39, name: "クマノミ", habitat: "海" },
            { id: 40, name: "ツノダシ", habitat: "海" },
            { id: 41, name: "チョウチョウウオ", habitat: "海" },
            { id: 42, name: "ナポレオンフィッシュ", habitat: "海" },
            { id: 43, name: "ミノカサゴ", habitat: "海" },
            { id: 44, name: "フグ", habitat: "海" },
            { id: 45, name: "ハリセンボン", habitat: "海" },
            { id: 46, name: "アジ", habitat: "海" },
            { id: 47, name: "イシダイ", habitat: "海" },
            { id: 48, name: "スズキ", habitat: "海" },
            { id: 49, name: "タイ", habitat: "海" },
            { id: 50, name: "カレイ", habitat: "海" },
            { id: 51, name: "ヒラメ", habitat: "海" },
            { id: 52, name: "マグロ", habitat: "海" },
            { id: 53, name: "カジキ", habitat: "海" },
            { id: 54, name: "ロウニンアジ", habitat: "海" },
            { id: 55, name: "シイラ", habitat: "海" },
            { id: 56, name: "エイ", habitat: "海" },
            { id: 57, name: "マンボウ", habitat: "海" },
            { id: 58, name: "シュモクザメ", habitat: "海" },
            { id: 59, name: "サメ", habitat: "海" },
            { id: 60, name: "ノコギリザメ", habitat: "海" },
            { id: 61, name: "ジンベエザメ", habitat: "海" },
            { id: 62, name: "リュウグウノツカイ", habitat: "海" },
            { id: 63, name: "アンコウ", habitat: "海" },
            { id: 64, name: "ウツボ", habitat: "海" },
            { id: 65, name: "ヒレナガエイ", habitat: "海" },
            { id: 66, name: "イカ", habitat: "海" },
            { id: 67, name: "パイク", habitat: "川" },
            { id: 68, name: "ワカサギ", habitat: "川" },
            { id: 69, name: "ブルーギル", habitat: "川" },
            { id: 70, name: "ブラックバス", habitat: "川" },
            { id: 71, name: "ライギョ", habitat: "池" },
            { id: 72, name: "シーラカンス", habitat: "海（雨・雪の日）" }
        ];

        const listContainer = document.getElementById('fish-list');

        // テーブルの生成
        fishData.forEach(fish => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="check-col"><input type="checkbox" id="f${fish.id}"></td>
                <td>${fish.name}</td>
                <td>${fish.habitat}</td>
            `;
            listContainer.appendChild(tr);
        });

        // チェック状態の保存と復元
        document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
            const id = checkbox.id;
            if (localStorage.getItem(id) === 'true') checkbox.checked = true;
            checkbox.addEventListener('change', () => localStorage.setItem(id, checkbox.checked));
        });
    </script>
</body>
</html>
